name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.tag.outputs.package_version }}
    steps:
      - name: Validate version tag
        id: tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a tag such as v1.2.3" >&2
            exit 1
          fi
          echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  validate:
    needs: version
    uses: ./.github/workflows/dotnet-ci.yml
    permissions:
      contents: read

  publish:
    needs: [version, validate]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore dotnet/SyncCronA.ApplicationAgent/SyncCronA.ApplicationAgent.csproj

      - name: Pack
        run: |
          dotnet pack dotnet/SyncCronA.ApplicationAgent/SyncCronA.ApplicationAgent.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts \
            -p:Version="$PACKAGE_VERSION" \
            -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push artifacts/SyncCronA.Extensions.$PACKAGE_VERSION.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
